<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tugasku</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#FFFDF8;--surface:#fff;--ink:#000;--text:#000;--pink:#FF9AA2;--yellow:#FFC480;--mint:#9BE7B5;--blue:#A5C8FF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--surface:#2a2926;--ink:#FFFDF8;--text:#FFFDF8}}
:root[data-theme="dark"]{--bg:#1c1b19;--surface:#2a2926;--ink:#FFFDF8;--text:#FFFDF8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-weight:500;
background-image:radial-gradient(var(--ink) 1px,transparent 1px);background-size:22px 22px;background-position:0 0}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.93;z-index:-1}
main{max-width:720px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:clamp(2.2rem,9vw,3.4rem);margin:8px 0 4px;letter-spacing:-.03em;line-height:1}
h1 span{background:var(--yellow);color:#000;padding:0 .2em;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:inline-block;transform:rotate(-1.5deg)}
.sub{margin:14px 0 18px;font-size:1.02rem}
.card{background:var(--surface);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:10px;padding:16px;margin-bottom:22px}
label{display:block;font-weight:700;margin:12px 0 5px}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:3px solid var(--ink);border-radius:8px;padding:10px 12px;outline:none}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
textarea{resize:vertical;min-height:56px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
button{font:inherit;font-weight:700;color:#000;cursor:pointer;border:3px solid var(--ink);border-radius:8px;padding:10px 16px;background:var(--yellow);box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.big{width:100%;margin-top:16px;font-size:1.1rem;background:var(--mint)}
.small{padding:6px 10px;font-size:.85rem;box-shadow:3px 3px 0 var(--ink)}
.small:active{transform:translate(3px,3px)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--blue);color:#000}
.bar p{margin:0;flex:1 1 200px}
.grp{margin-bottom:24px}
.gh{display:inline-block;font-weight:700;font-size:1.15rem;padding:5px 12px;border:3px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);margin-bottom:12px;color:#000}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:3px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);padding:12px;margin-bottom:14px}
.chk{width:34px;height:34px;flex:none;padding:0;background:var(--bg);color:var(--text);box-shadow:3px 3px 0 var(--ink);font-size:1.2rem}
.task.done .chk{background:var(--mint);color:#000}
.body{flex:1;min-width:0}
.t{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.done .t{text-decoration:line-through;opacity:.6}
.n{margin:3px 0;opacity:.85;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.tag{border:2px solid var(--ink);border-radius:6px;padding:2px 8px;font-size:.85rem;font-weight:700;background:var(--bg)}
.tag.late{background:var(--pink);color:#000}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{border:3px dashed var(--ink);border-radius:10px;padding:22px;text-align:center}
#alarm{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:20;display:none;background:var(--pink);color:#000;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:10px;padding:14px}
#alarm b{display:block;font-size:1.1rem;margin-bottom:8px}

h1::after{content:"!";display:inline-grid;place-items:center;width:.8em;height:.8em;margin-left:.35em;border:3px solid var(--ink);border-radius:50%;background:var(--pink);color:#000;box-shadow:4px 4px 0 var(--ink);transform:rotate(12deg);font-size:.8em}
.task{color:#000}
.task:nth-child(odd){transform:rotate(-.5deg)}.task:nth-child(even){transform:rotate(.5deg)}
.task .tag{background:#fff;color:#000}.task .chk{background:#fff;color:#000}
.task.done .chk{background:var(--mint)}
.t{font-size:1.2rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.st{border:3px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);padding:10px;text-align:center;color:#000;font-weight:700}
.st b{display:block;font-size:2.2rem;line-height:1}
.st:nth-child(1){transform:rotate(-1.5deg)}.st:nth-child(2){transform:rotate(1deg)}.st:nth-child(3){transform:rotate(-.8deg)}
.prog{grid-column:1/-1;position:relative;height:34px;border:3px solid var(--ink);border-radius:8px;background:var(--surface);overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-right:3px solid var(--ink)}
.prog span{position:relative;display:block;text-align:center;line-height:28px;font-weight:700;color:var(--text);mix-blend-mode:normal}
.card:first-of-type{background:var(--surface)}
</style>
</head>
<body>
<main>
<h1><span>Tugasku</span></h1>
<p class="sub">Catat tugas, tentukan deadline, dan lihat mana yang harus dikerjakan dulu.</p>

<div class="card bar" id="notifBar" hidden>
  <p>Aktifkan notifikasi supaya pengingat deadline muncul di perangkat ini.</p>
  <button class="small" id="notifBtn" type="button">Aktifkan notifikasi</button>
</div>

<div class="card">
  <div class="gh" style="background:var(--mint)">✏️ Tugas baru</div>
  <label for="title" style="margin-top:0">Tugas apa?</label>
  <input id="title" maxlength="120" placeholder="Contoh: Laporan praktikum">
  <label for="note">Catatan</label>
  <textarea id="note" maxlength="300" placeholder="Opsional"></textarea>
  <div class="row">
    <div><label for="due">Deadline</label><input id="due" type="datetime-local"></div>
    <div><label for="imp">Tingkat kepentingan</label>
      <select id="imp"><option value="1">Biasa</option><option value="2" selected>Penting</option><option value="3">Sangat penting</option></select></div>
  </div>
  <button class="big" id="add" type="button">Tambah tugas</button>
  <p id="err" style="margin:10px 0 0;font-weight:700"></p>
</div>

<div id="stats" class="stats"></div>
<div id="list"></div>
<p class="sub" id="sync"></p>
</main>

<div id="alarm" role="alert"><b id="alarmT"></b><button id="alarmOk" type="button">Matikan alarm</button></div>

<script>
const GROUPS=[
 {k:'now',name:'🔥 Kerjakan sekarang',c:'var(--pink)'},
 {k:'plan',name:'📅 Jadwalkan',c:'var(--yellow)'},
 {k:'quick',name:'⚡ Selesaikan cepat',c:'var(--mint)'},
 {k:'later',name:'😴 Santai dulu',c:'var(--blue)'}];
const HOUR=36e5, URGENT=24*HOUR;
let tasks=[], store=null, uid=null, dl=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS='tugasku:tasks', FIRED='tugasku:fired';

function quad(t){
  const urgent=new Date(t.due)-Date.now()<URGENT, imp=t.imp>=2;
  return urgent&&imp?'now':imp?'plan':urgent?'quick':'later';
}
function left(t){
  const d=new Date(t.due)-Date.now(), a=Math.abs(d), m=Math.round(a/6e4), h=Math.round(a/HOUR), dy=Math.round(a/(24*HOUR));
  const s=m<60?m+' menit':h<48?h+' jam':dy+' hari';
  return d<0?'Terlambat '+s:s+' lagi';
}
function fmt(iso){return new Date(iso).toLocaleString('id-ID',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}

function render(){
  const open=tasks.filter(t=>!t.done).sort((a,b)=>new Date(a.due)-new Date(b.due));
  const done=tasks.filter(t=>t.done);
  const nowN=open.filter(t=>quad(t)==='now').length, pct=tasks.length?Math.round(done.length/tasks.length*100):0;
  $('stats').innerHTML=`<div class="st" style="background:var(--pink)"><b>${nowN}</b>genting</div><div class="st" style="background:var(--yellow)"><b>${open.length}</b>aktif</div><div class="st" style="background:var(--mint)"><b>${done.length}</b>selesai</div><div class="prog"><i style="width:${pct}%"></i><span>${pct}% beres</span></div>`;
  let h='';
  if(!tasks.length) h='<div class="empty"><b>Belum ada tugas.</b><br>Isi formulir di atas untuk menambah tugas pertamamu.</div>';
  for(const g of GROUPS){
    const items=open.filter(t=>quad(t)===g.k);
    if(items.length) h+=`<div class="grp"><div class="gh" style="background:${g.c}">${g.name} (${items.length})</div>${items.map(row).join('')}</div>`;
  }
  if(done.length) h+=`<div class="grp"><div class="gh" style="background:var(--surface)">Selesai (${done.length})</div>${done.map(row).join('')}</div>`;
  $('list').innerHTML=h;
}
function row(t){
  const late=!t.done&&new Date(t.due)<Date.now();
  return `<div class="task ${t.done?'done':''}" style="background:${t.done?'#d9d9d9':GROUPS.find(g=>g.k===quad(t)).c}">
  <button class="chk" data-a="tog" data-id="${t.id}" aria-label="Tandai selesai">${t.done?'✓':''}</button>
  <div class="body"><div class="t">${esc(t.title)}</div>${t.note?`<div class="n">${esc(t.note)}</div>`:''}
  <div class="meta"><span class="tag">${fmt(t.due)}</span>${t.done?'':`<span class="tag ${late?'late':''}">${left(t)}</span>`}<span class="tag">${'★'.repeat(t.imp)+'☆'.repeat(3-t.imp)}</span></div>
  <div class="acts"><button class="small" data-a="gcal" data-id="${t.id}">Google Kalender</button><button class="small" data-a="ics" data-id="${t.id}">File .ics (4 pengingat)</button><button class="small" data-a="del" data-id="${t.id}" style="background:var(--pink)">Hapus</button></div></div></div>`;
}

/* ---------- penyimpanan ---------- */
function lsRead(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return []}}
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify(tasks))}catch(e){}}
async function save(t){
  if(store){try{await store.doc(t.id).set(t)}catch(e){$('err').textContent='Gagal menyimpan ke penyimpanan bersama.'}}
  else{const i=tasks.findIndex(x=>x.id===t.id);i<0?tasks.push(t):tasks[i]=t;lsWrite();render()}
}
async function remove(id){
  if(store){try{await store.doc(id).delete()}catch(e){}}
  else{tasks=tasks.filter(t=>t.id!==id);lsWrite();render()}
}
async function init(){
  tasks=lsRead();render();
  $('sync').textContent='Tugas tersimpan di browser perangkat ini. Data di HP dan laptop tidak saling tersinkron.';
}

/* ---------- aksi ---------- */
$('add').onclick=async()=>{
  const title=$('title').value.trim(), due=$('due').value;
  if(!title){$('err').textContent='Isi nama tugas dulu.';return}
  if(!due){$('err').textContent='Pilih tanggal dan jam deadline.';return}
  $('err').textContent='';
  await save({id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,note:$('note').value.trim(),due:new Date(due).toISOString(),imp:+$('imp').value,done:false});
  $('title').value='';$('note').value='';$('due').value='';
};
$('list').onclick=async e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const t=tasks.find(x=>x.id===b.dataset.id);if(!t)return;
  if(b.dataset.a==='tog')await save({...t,done:!t.done});
  if(b.dataset.a==='del')await remove(t.id);
  if(b.dataset.a==='ics')exportIcs(t);
  if(b.dataset.a==='gcal')openGcal(t);
};
function openGcal(t){
  const z=d=>new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const end=new Date(new Date(t.due).getTime()+30*6e4);
  const u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Deadline: '+t.title)+'&dates='+z(t.due)+'/'+z(end)+'&details='+encodeURIComponent(t.note||'');
  window.open(u,'_blank','noopener');
}
async function exportIcs(t){
  const z=d=>new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const end=new Date(new Date(t.due).getTime()+30*6e4);
  const clean=s=>String(s).replace(/[\r\n]+/g,' ').replace(/([,;\\])/g,'\\$1');
  const alarm=(m,d)=>`BEGIN:VALARM\r\nTRIGGER:-PT${m}M\r\nACTION:DISPLAY\r\nDESCRIPTION:${d}\r\nEND:VALARM\r\n`;
  const ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Tugasku//ID\r\nBEGIN:VEVENT\r\nUID:'+t.id+'@tugasku\r\nDTSTAMP:'+z(Date.now())+'\r\nDTSTART:'+z(t.due)+'\r\nDTEND:'+z(end)+'\r\nSUMMARY:Deadline: '+clean(t.title)+'\r\nDESCRIPTION:'+clean(t.note||'')+'\r\n'+alarm(1440,'Deadline besok')+alarm(180,'Deadline 3 jam lagi')+alarm(30,'Deadline 30 menit lagi')+alarm(0,'Deadline sekarang')+'END:VEVENT\r\nEND:VCALENDAR\r\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='deadline-'+t.id+'.ics';document.body.appendChild(a);a.click();a.remove();
}

/* ---------- notifikasi dan alarm ---------- */
function fired(){try{return JSON.parse(localStorage.getItem(FIRED)||'{}')}catch(e){return{}}}
function mark(k){try{const f=fired();f[k]=1;localStorage.setItem(FIRED,JSON.stringify(f))}catch(e){}}
let ctx=null, beepTimer=null;
function beep(){
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.25)}catch(e){}
}
function ring(msg){
  $('alarmT').textContent=msg;$('alarm').style.display='block';
  clearInterval(beepTimer);beep();beepTimer=setInterval(beep,900);
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
}
$('alarmOk').onclick=()=>{clearInterval(beepTimer);$('alarm').style.display='none'};
function notify(msg){
  try{if('Notification' in window&&Notification.permission==='granted')new Notification('Tugasku',{body:msg})}catch(e){}
}
function tick(){
  const f=fired(), now=Date.now();
  for(const t of tasks){
    if(t.done)continue;
    const d=new Date(t.due)-now;
    const steps=[['due',d<=0&&d>-HOUR,'Deadline sekarang: '+t.title],['m30',d<=30*6e4&&d>0,'30 menit lagi: '+t.title],['h3',d<=3*HOUR&&d>30*6e4,'3 jam lagi: '+t.title]];
    for(const [k,ok,msg] of steps){
      const key=t.id+':'+k;
      if(ok&&!f[key]){mark(key);notify(msg);ring(msg);break}
    }
  }
  render();
}
function checkNotif(){
  if(!('Notification' in window)||Notification.permission!=='default')return;
  $('notifBar').hidden=false;
}
$('notifBtn').onclick=async()=>{try{await Notification.requestPermission()}catch(e){}$('notifBar').hidden=true;beep()};
checkNotif();
init().then(()=>{tick();setInterval(tick,20000)});
</script>
</body>
</html>
